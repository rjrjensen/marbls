[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*"
export_path="build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include="<script>
// Cloudflare Pages serves files up to 25 MiB, and the engine is bigger, so
// scripts/build_web.sh splits it into parts. Join them back up here.
(function () {
  const parts = Number(\"__MARBLS_WASM_PARTS__\");
  if (!(parts > 0)) return;
  const originalFetch = window.fetch.bind(window);
  window.fetch = function (input, init) {
    const url = typeof input === \"string\" ? input : input.url;
    if (!url.endsWith(\".wasm\")) return originalFetch(input, init);
    const loads = [];
    for (let i = 0; i < parts; i++) {
      loads.push(originalFetch(url + \".part\" + i, init).then(function (response) {
        if (!response.ok) throw new Error(\"Could not load \" + url + \".part\" + i);
        return response.arrayBuffer();
      }));
    }
    return Promise.all(loads).then(function (buffers) {
      const blob = new Blob(buffers, { type: \"application/wasm\" });
      return new Response(blob, { status: 200, headers: { \"Content-Type\": \"application/wasm\" } });
    });
  };
})();
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
