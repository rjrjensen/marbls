name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: gdlint
        run: scripts/lint.sh

  test:
    name: Headless tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot
          key: godot-${{ hashFiles('scripts/install_godot.sh') }}

      - name: Install Godot
        run: echo "GODOT=$(scripts/install_godot.sh)" >> "$GITHUB_ENV"

      - name: Run tests
        run: scripts/test.sh
